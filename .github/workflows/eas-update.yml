name: EAS Update (OTA)

on:
  workflow_dispatch:
    inputs:
      message:
        description: Message pour la mise à jour EAS
        type: string
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli

      - name: 📦 Install dependencies
        run: |
          cd mobile
          npm ci

      - name: 📲 Publish EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_MESSAGE: ${{ inputs.message || format('Manual EAS update from {0}', github.sha) }}
        run: |
          cd mobile
          eas update --branch preview --message "$UPDATE_MESSAGE" --non-interactive

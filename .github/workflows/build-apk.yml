name: Build Android Preview APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli

      - name: 📦 Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🔎 Debug Grin PiP Gradle source
        run: |
          git log -1 --decorate
          for root in mobile/modules mobile/node_modules mobile/android; do
            if [ -d "$root" ]; then
              while IFS= read -r -d '' file; do
                printf '\n--- %s ---\n' "$file"
                cat "$file"
              done < <(find -L "$root" -type f -name build.gradle -path '*/grin-pip/*' -print0 | sort -z)
            fi
          done

      - name: Test local Gradle build
        run: |
          cd mobile
          npx expo prebuild --clean
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: 🔨 Build Android APK
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --clear-cache

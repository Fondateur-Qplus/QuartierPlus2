name: Build Android Preview APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: build-android-preview-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: 🏗 Checkout repo
        uses: actions/checkout@v4

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const contents = process.env.GOOGLE_SERVICES_JSON;
          if (!contents) {
            console.error("::error::Le secret GOOGLE_SERVICES_JSON est absent.");
            process.exit(1);
          }
          try {
            JSON.parse(contents);
          } catch {
            console.error("::error::Le secret GOOGLE_SERVICES_JSON n’est pas un JSON valide.");
            process.exit(1);
          }
          fs.writeFileSync("mobile/google-services.json", contents, { mode: 0o600 });
          NODE

      - name: 🔎 Vérifier l’URL et la disponibilité de l’API
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL || 'https://quartierplus-api.onrender.com' }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID || secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          MISSING_CONFIG=""
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_FIREBASE_PROJECT_ID EXPO_PUBLIC_GOOGLE_MAPS_API_KEY; do
            if [ -z "$(printenv "$name" | tr -d '[:space:]')" ]; then
              MISSING_CONFIG="$MISSING_CONFIG $name"
            fi
          done
          if [ -n "$MISSING_CONFIG" ]; then
            echo "::error::Configuration de build absente ou vide :$MISSING_CONFIG."
            exit 1
          fi

          API_HOST="$(node -e '
            const value = process.env.EXPO_PUBLIC_API_URL;
            if (!value.startsWith("https://")) {
              console.error("::error::EXPO_PUBLIC_API_URL doit commencer par https://.");
              process.exit(1);
            }
            if (value.endsWith("/")) {
              console.error("::error::EXPO_PUBLIC_API_URL ne doit pas se terminer par /.");
              process.exit(1);
            }
            if (/\/health|\/api|invalid/i.test(value)) {
              console.error("::error::EXPO_PUBLIC_API_URL ne doit contenir ni /health, ni /api, ni « invalid ».");
              process.exit(1);
            }
            try {
              const url = new URL(value);
              if (url.protocol !== "https:" || !url.hostname) throw new Error();
              process.stdout.write(url.host);
            } catch {
              console.error("::error::EXPO_PUBLIC_API_URL n’est pas une URL HTTPS valide.");
              process.exit(1);
            }
          ')" || exit 1
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          for attempt in 1 2 3 4 5 6; do
            HTTP_CODE="$(curl --silent --output "$RESPONSE_FILE" --write-out '%{http_code}' --max-time 15 "$EXPO_PUBLIC_API_URL/health" || true)"
            HTTP_CODE="${HTTP_CODE:-000}"
            echo "Hôte : $API_HOST — HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && node -e '
              try {
                process.exit(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).status === "ok" ? 0 : 1);
              } catch {
                process.exit(1);
              }
            ' "$RESPONSE_FILE"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 20
            fi
          done

          echo "::error::L’API n’a pas répondu avec HTTP 200 et status « ok » après 6 tentatives."
          exit 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate Firebase and app configuration
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL || 'https://quartierplus-api.onrender.com' }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID || secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          GITHUB_EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          GITHUB_EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          GITHUB_EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID_SOURCE: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID != '' && 'variable GitHub' || secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID != '' && 'secret GitHub' || 'absente' }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID_SOURCE: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID != '' && 'variable GitHub' || secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID != '' && 'secret GitHub' || 'absente' }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID_SOURCE: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID != '' && 'variable GitHub' || secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID != '' && 'secret GitHub' || 'absente' }}
          EXPO_PUBLIC_EAS_PROJECT_ID_SOURCE: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID != '' && 'variable GitHub' || secrets.EXPO_PUBLIC_EAS_PROJECT_ID != '' && 'secret GitHub' || 'absente' }}
          EXPO_PUBLIC_LIVEKIT_URL: ${{ vars.EXPO_PUBLIC_LIVEKIT_URL || secrets.EXPO_PUBLIC_LIVEKIT_URL || 'wss://quartierplus-98gp8fx8.livekit.cloud' }}
        run: |
          export EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID="$GITHUB_EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID"
          export EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID="$GITHUB_EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID"
          if [ -n "$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" ]; then
            export EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID="$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID"
          else
            unset EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          fi
          APP_EAS_PROJECT_ID="$(node -p "require('./mobile/app.json').expo?.extra?.eas?.projectId?.trim() ?? ''")"
          if [ -n "$APP_EAS_PROJECT_ID" ]; then
            export EXPO_PUBLIC_EAS_PROJECT_ID="$APP_EAS_PROJECT_ID"
            EAS_PROJECT_ID_SOURCE="app.json"
          else
            export EXPO_PUBLIC_EAS_PROJECT_ID="$GITHUB_EXPO_PUBLIC_EAS_PROJECT_ID"
            EAS_PROJECT_ID_SOURCE="$EXPO_PUBLIC_EAS_PROJECT_ID_SOURCE"
          fi
          echo "EXPO_PUBLIC_EAS_PROJECT_ID source: $EAS_PROJECT_ID_SOURCE"
          echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID source: $EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID_SOURCE"
          echo "EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID source: $EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID_SOURCE"
          echo "EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID source: $EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID_SOURCE"
          if [ -n "$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" ] && ! node -e '
            process.exit(/^\d+-[a-z0-9-]+\.apps\.googleusercontent\.com$/i.test(process.env.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID ?? "") ? 0 : 1);
          '; then
            echo "::warning::EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID invalide ; la connexion Google iOS ne sera pas configurée."
            unset EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          fi

          GOOGLE_SERVICES_FILE=mobile/google-services.json
          if [ ! -f "$GOOGLE_SERVICES_FILE" ]; then
            echo "::error::google-services.json absent."
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");

          const file = "mobile/google-services.json";
          const raw = fs.readFileSync(file, "utf8");
          const invisible = /[\u200B-\u200F\u2060\uFEFF\u00A0]/g;
          const cleaned = raw.replace(invisible, "");

          if (cleaned.length === 0) {
            console.log("Position de l’erreur de parse : non applicable");
            console.error("::error::google-services.json vide.");
            process.exit(1);
          }

          fs.writeFileSync(file, cleaned, "utf8");

          let config;
          try {
            config = JSON.parse(cleaned);
          } catch (error) {
            const message = error instanceof Error ? error.message : "";
            const position =
              message.match(/position\s+(\d+)/i)?.[1] ??
              (() => {
                const match = message.match(/line\s+(\d+)\s+column\s+(\d+)/i);
                if (!match) return "inconnue";
                const lines = cleaned.split("\n");
                return String(
                  lines
                    .slice(0, Number(match[1]) - 1)
                    .reduce((length, line) => length + line.length + 1, 0) +
                    Number(match[2]) -
                    1,
                );
              })();
            console.log(`Position de l’erreur de parse : ${position}`);
            console.error(
              "::error::Le fichier mobile/google-services.json est invalide.",
            );
            process.exit(1);
          }

          if (typeof config.project_info?.project_id !== "string" || !config.project_info.project_id.trim()) {
            console.error("::error::Clé manquante ou vide : project_info.project_id.");
            process.exit(1);
          }

          if (
            !Array.isArray(config.client) ||
            config.client.length === 0 ||
            config.client.some(
              (client) =>
                typeof client?.client_info?.android_client_info?.package_name !== "string" ||
                !client.client_info.android_client_info.package_name.trim(),
            )
          ) {
            console.error(
              "::error::Clé manquante ou vide : client[].client_info.android_client_info.package_name.",
            );
            process.exit(1);
          }
          NODE

          EXPECTED_PACKAGE="$(node -p "require('./mobile/app.json').expo.android.package")"
          if [ -z "$EXPECTED_PACKAGE" ]; then
            echo "::error::expo.android.package est absent de mobile/app.json."
            exit 1
          fi
          if ! node -e "const config=require('./mobile/google-services.json'); if (!config.client.some((client) => client.client_info.android_client_info.package_name === process.argv[1])) process.exit(1)" "$EXPECTED_PACKAGE"; then
            echo "::error::Le package_name de google-services.json ne correspond pas à expo.android.package dans mobile/app.json."
            exit 1
          fi
          EXPECTED_PACKAGE="$EXPECTED_PACKAGE" node <<'NODE'
          const config = require("./mobile/google-services.json");
          const packageName = process.env.EXPECTED_PACKAGE;
          const clients = Array.isArray(config.client) ? config.client : [];
          const oauthClients = clients.flatMap((client) =>
            Array.isArray(client.oauth_client) ? client.oauth_client : [],
          );
          const androidClient = oauthClients.find(
            (oauth) =>
              oauth.client_type === 1 &&
              oauth.android_info?.package_name === packageName &&
              typeof oauth.android_info?.certificate_hash === "string" &&
              oauth.android_info.certificate_hash.length > 0,
          );
          const projectNumber = String(config.project_info.project_number ?? "");
          const certificateHash = androidClient?.android_info.certificate_hash;

          console.log(`Configuration Firebase lue : mobile/google-services.json`);
          console.log(`Entrées oauth_client : ${oauthClients.length}`);
          console.log(`Client OAuth Android client_type 1 : ${androidClient ? "présent" : "absent"}`);
          console.log(`package_name attendu : ${packageName}`);
          console.log(`project_id : ${config.project_info.project_id}`);
          console.log(`certificate_hash (8 premiers caractères) : ${certificateHash ? certificateHash.slice(0, 8) : "absent"}`);

          if (!androidClient) {
            console.error(
              "::error::Client OAuth Android client_type 1 absent de google-services.json pour le package attendu ; vérifiez dans Firebase le package et le SHA-1 du certificat EAS, puis remplacez le secret GOOGLE_SERVICES_JSON.",
            );
            process.exit(1);
          }

          NODE
          FIREBASE_PROJECT_ID="$(node -p "require('./mobile/google-services.json').project_info.project_id")"
          if printf '%s' "$EXPO_PUBLIC_FIREBASE_PROJECT_ID" | grep -q '[^[:space:]]' && [ "$FIREBASE_PROJECT_ID" != "$EXPO_PUBLIC_FIREBASE_PROJECT_ID" ]; then
            echo "::error::google-services.json et EXPO_PUBLIC_FIREBASE_* ne viennent pas du même projet Firebase."
            exit 1
          fi

          MISSING_CONFIG=""
          if ! printf '%s' "$EXPO_PUBLIC_FIREBASE_PROJECT_ID" | grep -q '[^[:space:]]'; then
            MISSING_CONFIG="$MISSING_CONFIG EXPO_PUBLIC_FIREBASE_PROJECT_ID"
          fi
          if ! printf '%s' "$EXPO_PUBLIC_API_URL" | grep -q '[^[:space:]]'; then
            MISSING_CONFIG="$MISSING_CONFIG EXPO_PUBLIC_API_URL"
          fi
          if ! printf '%s' "$EXPO_PUBLIC_GOOGLE_MAPS_API_KEY" | grep -q '[^[:space:]]'; then
            MISSING_CONFIG="$MISSING_CONFIG EXPO_PUBLIC_GOOGLE_MAPS_API_KEY"
          fi
          if ! printf '%s' "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" | grep -q '[^[:space:]]'; then
            MISSING_CONFIG="$MISSING_CONFIG EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID"
          fi
          if ! printf '%s' "$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID" | grep -q '[^[:space:]]'; then
            MISSING_CONFIG="$MISSING_CONFIG EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID"
          fi
          if [ -n "$MISSING_CONFIG" ]; then
            echo "::error::Configuration de build absente ou vide :$MISSING_CONFIG."
            exit 1
          fi
          if ! node -e '
            const valid = (value) => /^\d+-[a-z0-9-]+\.apps\.googleusercontent\.com$/i.test(value);
            for (const name of ["EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID", "EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID"]) {
              if (!valid(process.env[name])) {
                console.error(`::error::${name} doit être un identifiant client OAuth Google valide.`);
                process.exitCode = 1;
              }
            }
          '; then
            exit 1
          fi
          if ! node <<'NODE'
          const config = require("./mobile/google-services.json");
          const packageName = require("./mobile/app.json").expo.android.package;
          const clientId = process.env.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID;
          const projectNumber = String(config.project_info.project_number ?? "");
          const clients = (Array.isArray(config.client) ? config.client : []).flatMap(
            (client) => Array.isArray(client.oauth_client) ? client.oauth_client : [],
          );
          const matchingAndroidClient = clients.some(
            (client) =>
              client.client_type === 1 &&
              client.client_id === clientId &&
              client.android_info?.package_name === packageName,
          );
          const clientProjectNumber = clientId.match(/^(\d+)-/)?.[1];

          if (!matchingAndroidClient) {
            console.error(
              "::error::EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID n’est pas présent dans google-services.json pour le package Android configuré.",
            );
            process.exit(1);
          }
          if (!clientProjectNumber || clientProjectNumber !== projectNumber) {
            console.error(
              "::error::EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID ne vient pas du même projet que google-services.json.",
            );
            process.exit(1);
          }
          NODE
          then
            exit 1
          fi
          if ! printf '%s' "$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" | grep -q '[^[:space:]]'; then
            echo "::warning::EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID absent ; la connexion Google iOS ne sera pas configurée."
          fi
          if ! node -e '
            const id = process.env.EXPO_PUBLIC_EAS_PROJECT_ID ?? "";
            const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);
            const isAllZero = /^0{8}-0{4}-0{4}-0{4}-0{12}$/.test(id);
            if (!id || !isUuid || isAllZero) {
              console.error("::error::Identifiant EAS absent ou factice : renseignez extra.eas.projectId dans app.json ou EXPO_PUBLIC_EAS_PROJECT_ID dans GitHub.");
              process.exit(1);
            }
          '; then
            exit 1
          fi
          if ! printf '%s' "$EXPO_PUBLIC_LIVEKIT_URL" | grep -q '[^[:space:]]'; then
            echo "::warning::EXPO_PUBLIC_LIVEKIT_URL absent ; les fonctionnalités LiveKit seront indisponibles."
          fi

      - name: Expo prebuild
        env:
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY || secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID || secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID || secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL || 'https://quartierplus-api.onrender.com' }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_LIVEKIT_URL: ${{ vars.EXPO_PUBLIC_LIVEKIT_URL || secrets.EXPO_PUBLIC_LIVEKIT_URL || 'wss://quartierplus-98gp8fx8.livekit.cloud' }}
        run: |
          cd mobile
          if [ -n "$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" ]; then
            if [[ "$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" =~ ^[0-9]+-[a-zA-Z0-9-]+\.apps\.googleusercontent\.com$ ]]; then
              export EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID="$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID"
            else
              unset EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
            fi
          else
            unset EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          fi
          APP_EAS_PROJECT_ID="$(node -p "require('./app.json').expo?.extra?.eas?.projectId?.trim() ?? ''")"
          if [ -n "$APP_EAS_PROJECT_ID" ]; then
            export EXPO_PUBLIC_EAS_PROJECT_ID="$APP_EAS_PROJECT_ID"
          fi
          npx expo prebuild --clean --platform android

      - name: Configure Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on EAS and download the preview APK
        id: eas-build
        working-directory: mobile
        env:
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY || secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID || secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID || secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID || secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL || 'https://quartierplus-api.onrender.com' }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_LIVEKIT_URL: ${{ vars.EXPO_PUBLIC_LIVEKIT_URL || secrets.EXPO_PUBLIC_LIVEKIT_URL || 'wss://quartierplus-98gp8fx8.livekit.cloud' }}
        run: |
          if [ -n "$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" ]; then
            if [[ "$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" =~ ^[0-9]+-[a-zA-Z0-9-]+\.apps\.googleusercontent\.com$ ]]; then
              export EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID="$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID"
            else
              unset EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
            fi
          else
            unset EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          fi
          APP_EAS_PROJECT_ID="$(node -p "require('./app.json').expo?.extra?.eas?.projectId?.trim() ?? ''")"
          if [ -n "$APP_EAS_PROJECT_ID" ]; then
            export EXPO_PUBLIC_EAS_PROJECT_ID="$APP_EAS_PROJECT_ID"
          fi
          BUILD_JSON="$(eas build --platform android --profile preview --non-interactive --wait --json)"
          BUILD_URL="$(BUILD_JSON="$BUILD_JSON" node <<'NODE'
          const result = JSON.parse(process.env.BUILD_JSON);
          const builds = Array.isArray(result) ? result : [result];
          const build = [...builds].reverse().find((item) => item?.artifacts?.buildUrl);
          const url = build?.artifacts?.buildUrl;
          if (typeof url !== "string" || !url.startsWith("https://")) {
            console.error("EAS n’a pas renvoyé d’URL HTTPS pour l’APK.");
            process.exit(1);
          }
          process.stdout.write(url);
          NODE
          )"
          printf 'EAS build: %s\n' "$BUILD_URL" >> "$GITHUB_STEP_SUMMARY"
          printf 'build_url=%s\n' "$BUILD_URL" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          curl --fail --location --retry 3 --output artifacts/quartierplus-preview.apk "$BUILD_URL"
          test -s artifacts/quartierplus-preview.apk

      - name: Publish preview APK GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EAS_BUILD_URL: ${{ steps.eas-build.outputs.build_url }}
        run: |
          RELEASE_TAG="quartierplus-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$RELEASE_TAG" \
            mobile/artifacts/quartierplus-preview.apk \
            --title "QuartierPlus Android preview ${GITHUB_RUN_NUMBER}" \
            --notes "Build EAS: ${EAS_BUILD_URL}" \
            --prerelease
          printf 'GitHub Release: https://github.com/%s/releases/tag/%s\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

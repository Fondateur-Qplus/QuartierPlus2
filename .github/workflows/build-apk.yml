name: Build Android Preview APK

on:
  workflow_dispatch:
    inputs:
      etape:
        description: Étape à exécuter
        type: choice
        options:
          - compilation
          - apk
        default: compilation
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: build-android-preview-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: 🏗 Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔎 Debug Grin PiP Gradle source
        run: |
          git log -1 --decorate
          for root in mobile/modules mobile/node_modules mobile/android; do
            if [ -d "$root" ]; then
              while IFS= read -r -d '' file; do
                printf '\n--- %s ---\n' "$file"
                cat "$file"
              done < <(find -L "$root" -type f -name build.gradle -path '*/grin-pip/*' -print0 | sort -z)
            fi
          done

      - name: Configure Google services
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "::error::Le secret GOOGLE_SERVICES_JSON est absent ou vide."
            exit 1
          fi
          printf '%s' "$GSJ" > mobile/google-services.json

      - name: Validate Firebase and app configuration
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          if ! node -e "JSON.parse(require('fs').readFileSync('mobile/google-services.json', 'utf8'))" >/dev/null 2>&1; then
            echo "::error::Le fichier google-services.json est absent ou contient un JSON invalide."
            exit 1
          fi

          EXPECTED_PACKAGE="$(node -p "require('./mobile/app.json').expo.android.package")"
          FIREBASE_PROJECT_ID="$(node -p "require('./mobile/google-services.json').project_info.project_id")"
          FIREBASE_PACKAGE_NAMES="$(node -p "Array.from(new Set((require('./mobile/google-services.json').client || []).map((client) => client.client_info?.android_client_info?.package_name).filter(Boolean))).join(',')")"

          if [ -z "$FIREBASE_PROJECT_ID" ] || [ "$FIREBASE_PROJECT_ID" = "undefined" ]; then
            echo "::error::project_info.project_id est absent de google-services.json."
            exit 1
          fi

          printf 'Firebase project_id: %s\n' "$FIREBASE_PROJECT_ID"
          printf 'Firebase package_name: %s\n' "$FIREBASE_PACKAGE_NAMES"

          if [ -z "$EXPECTED_PACKAGE" ]; then
            echo "::error::expo.android.package est absent de mobile/app.json."
            exit 1
          fi
          if [ "$FIREBASE_PACKAGE_NAMES" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::Le package_name de google-services.json ne correspond pas à expo.android.package dans mobile/app.json."
            exit 1
          fi
          if printf '%s' "$EXPO_PUBLIC_FIREBASE_PROJECT_ID" | grep -q '[^[:space:]]' && [ "$FIREBASE_PROJECT_ID" != "$EXPO_PUBLIC_FIREBASE_PROJECT_ID" ]; then
            echo "::error::google-services.json et EXPO_PUBLIC_FIREBASE_* ne viennent pas du même projet Firebase."
            exit 1
          fi

          MISSING_CONFIG=""
          if ! printf '%s' "$EXPO_PUBLIC_FIREBASE_PROJECT_ID" | grep -q '[^[:space:]]'; then
            MISSING_CONFIG="$MISSING_CONFIG EXPO_PUBLIC_FIREBASE_PROJECT_ID"
          fi
          if ! printf '%s' "$EXPO_PUBLIC_API_URL" | grep -q '[^[:space:]]'; then
            MISSING_CONFIG="$MISSING_CONFIG EXPO_PUBLIC_API_URL"
          fi
          if ! printf '%s' "$EXPO_PUBLIC_GOOGLE_MAPS_API_KEY" | grep -q '[^[:space:]]'; then
            MISSING_CONFIG="$MISSING_CONFIG EXPO_PUBLIC_GOOGLE_MAPS_API_KEY"
          fi
          if [ -n "$MISSING_CONFIG" ]; then
            echo "::error::Configuration de build absente ou vide :$MISSING_CONFIG."
            exit 1
          fi

      - name: Expo prebuild
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_LIVEKIT_URL: ${{ secrets.EXPO_PUBLIC_LIVEKIT_URL }}
        run: |
          cd mobile
          npx expo prebuild --clean

      - name: Gradle compilation validation
        if: inputs.etape == 'compilation'
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_LIVEKIT_URL: ${{ secrets.EXPO_PUBLIC_LIVEKIT_URL }}
        run: |
          ./gradlew -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" help
          ./gradlew -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" \
            :app:assembleRelease --dry-run

      - name: Build release APK
        if: inputs.etape == 'apk'
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_LIVEKIT_URL: ${{ secrets.EXPO_PUBLIC_LIVEKIT_URL }}
        run: |
          ./gradlew -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -x lintVitalRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            :app:assembleRelease

      - name: Upload release APK
        if: inputs.etape == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: quartierplus-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

name: Build Android Preview APK

on:
  workflow_dispatch:
    inputs:
      etape:
        description: Étape à exécuter
        type: choice
        options:
          - compilation
          - apk
        default: compilation
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: build-android-preview-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: 🏗 Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔎 Debug Grin PiP Gradle source
        run: |
          git log -1 --decorate
          for root in mobile/modules mobile/node_modules mobile/android; do
            if [ -d "$root" ]; then
              while IFS= read -r -d '' file; do
                printf '\n--- %s ---\n' "$file"
                cat "$file"
              done < <(find -L "$root" -type f -name build.gradle -path '*/grin-pip/*' -print0 | sort -z)
            fi
          done

      - name: Expo prebuild
        run: |
          cd mobile
          npx expo prebuild --clean

      - name: Gradle compilation validation
        if: inputs.etape == 'compilation'
        working-directory: mobile/android
        run: |
          ./gradlew -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" help
          ./gradlew -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" \
            :app:assembleRelease --dry-run

      - name: Build release APK
        if: inputs.etape == 'apk'
        working-directory: mobile/android
        run: |
          ./gradlew -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -x lintVitalRelease \
            -PreactNativeArchitectures=arm64-v8a \
            :app:assembleRelease

      - name: Upload release APK
        if: inputs.etape == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: quartierplus-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

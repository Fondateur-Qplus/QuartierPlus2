name: Build Android Preview APK

on:
  workflow_dispatch:
    inputs:
      etape:
        description: Étape à exécuter
        type: choice
        options:
          - compilation
          - apk
        default: compilation
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: build-android-preview-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: 🏗 Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔎 Debug Grin PiP Gradle source
        run: |
          git log -1 --decorate
          for root in mobile/modules mobile/node_modules mobile/android; do
            if [ -d "$root" ]; then
              while IFS= read -r -d '' file; do
                printf '\n--- %s ---\n' "$file"
                cat "$file"
              done < <(find -L "$root" -type f -name build.gradle -path '*/grin-pip/*' -print0 | sort -z)
            fi
          done

      - name: Configure Google services
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "::error::Required repository secret GOOGLE_SERVICES_JSON is missing or empty."
            exit 1
          fi
          printf '%s' "$GSJ" > mobile/google-services.json

      - name: Validate Google services package
        run: |
          grep -o '"package_name"[[:space:]]*:[[:space:]]*"[^"]*"' mobile/google-services.json || true
          node <<'NODE'
          const fs = require('fs');

          const expectedPackage = 'com.quartierplus_bf.quartierplus';
          const googleServices = JSON.parse(fs.readFileSync('mobile/google-services.json', 'utf8'));
          const appConfig = JSON.parse(fs.readFileSync('mobile/app.json', 'utf8'));
          const packageNames = (googleServices.client ?? [])
            .map((client) => client.client_info?.android_client_info?.package_name)
            .filter(Boolean);

          if (!packageNames.includes(expectedPackage)) {
            console.error(`::error::mobile/google-services.json does not contain package_name "${expectedPackage}".`);
            process.exit(1);
          }

          if (appConfig.expo?.android?.package !== expectedPackage) {
            console.error(`::error::expo.android.package in mobile/app.json must be "${expectedPackage}".`);
            process.exit(1);
          }
          NODE

      - name: Expo prebuild
        run: |
          cd mobile
          npx expo prebuild --clean

      - name: Gradle compilation validation
        if: inputs.etape == 'compilation'
        working-directory: mobile/android
        run: |
          ./gradlew -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" help
          ./gradlew -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" \
            :app:assembleRelease --dry-run

      - name: Build release APK
        if: inputs.etape == 'apk'
        working-directory: mobile/android
        run: |
          ./gradlew -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -x lintVitalRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            :app:assembleRelease

      - name: Upload release APK
        if: inputs.etape == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: quartierplus-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
